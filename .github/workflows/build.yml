name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    env:
      THEOS: ${{ github.workspace }}/../theos
    steps:
      - uses: actions/checkout@v4

      - name: Fix libtinfo.so.5 dependency (Symlink)
        run: |
          # Tìm vị trí thư viện libtinfo.so.6 và tạo liên kết tượng trưng
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ldconfig
  
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential coreutils curl git unzip xz-utils \
            perl tar fakeroot dpkg-dev libssl-dev \
            libplist-dev pkg-config

      - name: Build ldid from source (không có trong apt Ubuntu 26.04)
        run: |
          git clone --recursive --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
          make -C ldid-src -j"$(nproc)"
          sudo install -m 755 ldid-src/ldid /usr/local/bin/ldid
          ldid -h 2>&1 | head -n 1 || true

      - name: Install roothide/theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"

      - name: Install iOS toolchain for Linux (clang + ld64)
        run: |
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -L -o toolchain.tar.lzma \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar -xf toolchain.tar.lzma -C "$TMP"
          cp -r "$TMP"/ios-arm64e-clang-toolchain/* "$THEOS/toolchain/linux/iphone/"
          chmod -R +x "$THEOS/toolchain/linux/iphone/bin" || true
          rm -rf toolchain.tar.lzma "$TMP"

      - name: Install iOS SDK (iPhoneOS 16.5)
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git sdks-tmp
          mkdir -p "$THEOS/sdks"
          cp -r sdks-tmp/iPhoneOS16.5.sdk "$THEOS/sdks/"
          rm -rf sdks-tmp

      - name: Build ${{ matrix.scheme }} package
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make clean package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Rename package
        run: mv packages/*.deb "packages/DepthWallpaper.${{ matrix.scheme }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: DepthWallpaper-${{ matrix.scheme }}
          path: packages/DepthWallpaper.${{ matrix.scheme }}.deb

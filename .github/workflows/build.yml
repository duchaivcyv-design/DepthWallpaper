name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid xz dpkg

      - name: Install roothide/theos (dùng cho cả rootless và roothide)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $HOME/theos
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          cp -r $HOME/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Build ${{ matrix.scheme }} package
        env:
          THEOS: ${{ env.HOME }}/theos
        run: make clean package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Rename package
        run: mv packages/*.deb packages/DepthWallpaper.${{ matrix.scheme }}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: DepthWallpaper-${{ matrix.scheme }}
          path: packages/DepthWallpaper.${{ matrix.scheme }}.deb
